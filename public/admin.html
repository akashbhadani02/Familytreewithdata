<!doctype html>
<html lang="gu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Family Tree Admin</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #203047
        }

        header {
            background: #fff;
            border-bottom: 1px solid #dce4ec;
            padding: 16px;
            text-align: center
        }

        header h1 {
            margin: 0
        }

        .wrap {
            max-width: 1250px;
            margin: 18px auto;
            padding: 0 14px
        }

        .panel {
            background: #fff;
            border: 1px solid #dce4ec;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 28px #20304712;
            margin-bottom: 18px
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        input {
            padding: 12px;
            border: 1px solid #cbd6e2;
            border-radius: 10px;
            font-size: 15px
        }

        .btn {
            padding: 11px 15px;
            border: 0;
            border-radius: 10px;
            background: #315f91;
            color: #fff;
            font-weight: 800;
            cursor: pointer
        }

        .btn.gray {
            background: #e9eef4;
            color: #30445b
        }

        .btn.danger {
            background: #dc3545;
            color: #fff
        }

        .btn.danger:hover {
            filter: brightness(.95)
        }

        .families {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px
        }

        .family {
            border: 1px solid #dce4ec;
            border-radius: 12px;
            padding: 14px
        }

        .family-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.family-actions .btn{flex:1;min-width:120px}.family b {
            display: block;
            margin-bottom: 6px
        }

        .treebox {
            overflow: auto;
            border: 1px solid #dce4ec;
            border-radius: 14px;
            height: 680px
        }

        .canvas {
            position: relative;
            width: 7000px;
            height: 5000px;
            background: #fbfcfe
        }

        .card {
            position: absolute;
            width: 190px;
            background: #fff;
            border: 1px solid #cbd7e4;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 5px 18px #24384e18;
            z-index: 2
        }

        .card img {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0e7ef
        }

        .card b {
            display: block;
            font-size: 14px;
            margin-top: 6px
        }

        .card small {
            display: block;
            color: #718096;
            font-size: 10px;
            margin-top: 3px
        }

        /* Clean parent-child connectors: lines stay only in the gap between cards. */
        #svg { pointer-events:none; }
        #svg path {
            stroke: #7b8da3 !important;
            stroke-width: 3 !important;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none !important;
        }
        .treebox { -webkit-overflow-scrolling: touch; }
        @media (max-width: 700px) {
            header h1 { font-size: 20px; }
            .wrap { padding: 0 8px; margin: 10px auto; }
            .panel { padding: 12px; border-radius: 12px; }
            .treebox { height: 560px; }
            .canvas { width: 7000px; height: 5000px; }
            .card { width: 190px; }
            #svg path { stroke-width: 3 !important; }
            .member-list { grid-template-columns: 1fr; }
            .row .btn { min-height: 42px; }
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #718096
        }

        .danger {
            background: #b53a3a
        }


        .member-tools { margin-top:8px; padding-top:8px; border-top:1px solid #edf1f5; }
        .member-link { width:100%; font-size:11px; padding:8px; border:1px solid #d8e1eb; border-radius:8px; background:#f7f9fc; }
        .tool-row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
        .tool-row .btn { padding:7px 9px; font-size:11px; }
        .links-panel { margin-top:16px; border-top:1px solid #e2e8f0; padding-top:14px; }
        .member-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; margin-top:10px; }
        .member-item { border:1px solid #dce4ec; border-radius:12px; padding:12px; background:#fbfcfe; }
        .member-item .name { font-weight:800; }
        .member-item small { color:#718096; display:block; margin:3px 0 8px; }

        .status {
            margin-top: 10px;
            color: #315f91;
            font-size: 13px
        }

        /* =========================
           NATURAL / REAL TREE MODE
        ========================== */
        .treebox.natural-mode{background:linear-gradient(#dff3ff 0%,#f7fcff 48%,#d8efc6 100%);overflow:auto;min-height:760px;border-radius:16px}
        .natural-canvas{position:relative;width:2600px;height:1900px;min-height:1900px;overflow:hidden;background:linear-gradient(to bottom,#e9f8ff 0 56%,#cce8ae 100%)}
        .natural-canvas .ground{position:absolute;left:-5%;right:-5%;bottom:-55px;height:180px;background:radial-gradient(ellipse at 50% 15%,#78aa4e 0,#91bf68 28%,#5f963f 72%,#4d8036 100%);border-radius:50% 50% 0 0/35% 35% 0 0;z-index:2}
        .natural-canvas .canopy{position:absolute;left:50%;top:25px;width:2050px;height:760px;transform:translateX(-50%);z-index:1;background:radial-gradient(circle at 8% 56%,#3e8631 0 150px,transparent 153px),radial-gradient(circle at 18% 30%,#62ad43 0 180px,transparent 183px),radial-gradient(circle at 32% 18%,#76bf4d 0 190px,transparent 193px),radial-gradient(circle at 48% 13%,#58a83d 0 210px,transparent 213px),radial-gradient(circle at 64% 17%,#70bb4a 0 195px,transparent 198px),radial-gradient(circle at 79% 32%,#5aa33c 0 180px,transparent 183px),radial-gradient(circle at 92% 57%,#3f8731 0 145px,transparent 148px),radial-gradient(circle at 50% 50%,#3b8730 0 320px,transparent 323px);filter:drop-shadow(0 18px 14px rgba(45,90,30,.2))}
        .natural-canvas .canopy:after{content:"";position:absolute;inset:80px;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 5px,transparent 6px),radial-gradient(circle at 40% 12%,rgba(255,255,255,.14) 0 4px,transparent 5px),radial-gradient(circle at 68% 28%,rgba(255,255,255,.16) 0 5px,transparent 6px),radial-gradient(circle at 82% 18%,rgba(255,255,255,.13) 0 4px,transparent 5px)}
        .natural-canvas .trunk{position:absolute;left:50%;top:370px;width:245px;height:1320px;transform:translateX(-50%);z-index:3;border-radius:48% 48% 18% 18%/8% 8% 4% 4%;background:linear-gradient(90deg,#4e2b16 0%,#70421f 16%,#9b6232 34%,#6a3d1d 51%,#9a6030 68%,#72421f 84%,#4c2915 100%);box-shadow:inset 18px 0 24px rgba(35,16,5,.25),inset -18px 0 25px rgba(35,16,5,.2),0 12px 25px rgba(55,35,15,.2)}
        .natural-canvas .trunk:before,.natural-canvas .trunk:after{content:"";position:absolute;top:50px;bottom:60px;width:8px;border-radius:50%;background:rgba(45,22,8,.22)}.natural-canvas .trunk:before{left:78px;transform:rotate(3deg)}.natural-canvas .trunk:after{right:74px;transform:rotate(-4deg)}
        .natural-canvas .roots{position:absolute;left:50%;bottom:25px;width:850px;height:240px;transform:translateX(-50%);z-index:3;background:radial-gradient(ellipse at center,#70401e 0 25%,transparent 27%),radial-gradient(ellipse at 20% 75%,#70401e 0 13%,transparent 15%),radial-gradient(ellipse at 80% 75%,#70401e 0 13%,transparent 15%);filter:drop-shadow(0 8px 8px rgba(40,25,10,.25))}
        .natural-canvas .natural-svg{position:absolute;inset:0;z-index:4;pointer-events:none}
        .natural-card{position:absolute;width:158px;min-height:112px;padding:8px;text-align:center;background:rgba(255,255,255,.97);border:3px solid #fff;border-radius:18px;box-shadow:0 9px 22px rgba(30,55,25,.22);z-index:12}
        .natural-card img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.22)}
        .natural-card b{display:block;margin-top:5px;font-size:13px;color:#25361f}.natural-card small{display:block;margin-top:2px;color:#3f8c46;font-weight:700}
        .natural-card.trunk-card{width:210px;min-height:145px;border:5px solid #e2ad31;border-radius:22px;background:linear-gradient(#fffdf2,#fff);box-shadow:0 10px 28px rgba(65,45,12,.3);z-index:20}
        .natural-card.trunk-card img{width:78px;height:78px}.natural-card.trunk-card:before{content:"♛";position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:27px;color:#d39b13}
        .natural-card.branch-card{border-color:#ead7bc;background:#fffdf9}
        .natural-card.leaf-card{width:145px;min-height:96px;border:3px solid #9bcf6b;border-radius:52% 48% 52% 48%/58% 42% 58% 42%;background:linear-gradient(145deg,#fbfff7,#eaf7dc);box-shadow:0 8px 18px rgba(49,95,35,.2)}
        .natural-card.leaf-card img{width:50px;height:50px}.natural-card.leaf-card b{font-size:12px}.natural-card.leaf-card small{font-size:10px}
        .natural-tools{position:absolute;top:16px;right:18px;z-index:30;display:flex;gap:8px;flex-wrap:wrap}.natural-tools .btn{box-shadow:0 5px 14px rgba(0,0,0,.12)}
        @media(max-width:700px){
            .natural-canvas{width:1900px;min-height:1500px}.natural-canvas .canopy{width:1450px;height:500px}.natural-canvas .trunk{width:175px;height:1180px;top:190px}.natural-canvas .roots{width:470px}.natural-card{width:145px;min-height:120px}.natural-card img{width:58px;height:58px}.natural-card.root-card{width:170px;min-height:140px}.natural-card.root-card img{width:72px;height:72px}.natural-tools{left:12px;right:auto;top:12px}
        }
    </style>
</head>

<body>
    <header>
        <h1>🌳 Family Tree Admin</h1>
    </header>
    <div class="wrap">
        <div id="login" class="panel">
            <h2>Admin Login</h2>
            <div class="row"><input id="key" type="password" placeholder="Admin password"><button class="btn"
                    onclick="login()">Login</button></div>
            <div class="status">Admin password: call on 9106141725 </div>
        </div>
        <div id="app" style="display:none">
            <div class="panel">
                <div class="row"><button class="btn" onclick="loadFamilies()">🔄 Refresh</button><button class="btn" onclick="createFamily()">➕ નવી Family બનાવો</button><button
                        class="btn gray" onclick="logout()">Logout</button></div>
                <div id="families" class="families" style="margin-top:14px"></div>
            </div>
            <div id="viewer" class="panel" style="display:none">
                <div class="row">
                    <h2 id="viewerTitle" style="margin:0;flex:1">🌳 Selected Family</h2><button class="btn gray" onclick="renderTree()">▦ Simple Tree</button><button class="btn" onclick="renderNaturalTree()">🌳 Real Tree</button><button class="btn" onclick="downloadPNG()">🖼️ Download PNG</button><button class="btn danger" onclick="deleteCurrentFamily()">🗑️ આખી Tree Delete</button>
                </div>
                <div id="treebox" class="treebox">
                    <div id="canvas" class="canvas"><svg id="svg" width="8000" height="4500"
                            style="position:absolute;left:0;top:0;z-index:1"></svg>
                        <div id="cards"></div>
                    </div>
                </div>
                <div class="links-panel">
                    <h3 style="margin:0">🔗 બધા Members ની Links</h3>
                    <div style="font-size:13px;color:#718096;margin-top:5px">Admin અહીંથી કોઈપણ member નું નામ બદલી શકે છે અને તેની link copy/share કરી શકે છે. Name બદલવાથી link બદલાશે નહીં.</div>
                    <div id="memberLinks" class="member-list"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let key = '', people = []; const $ = id => document.getElementById(id);
function showAdminApp() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
}
function login() {
  const entered = $('key').value.trim();
  if (!entered) return;
  key = entered;
  sessionStorage.setItem('adminKey', key);
  showAdminApp();
  loadFamilies();
}
function logout() {
  key = '';
  sessionStorage.removeItem('adminKey');
  location.reload();
}
async function createFamily(){
  const name=prompt('નવી Family માટે પ્રથમ સભ્યનું પૂરું નામ લખો:');
  if(!name || !name.trim()) return;
  try{
    const fd=new FormData();
    fd.append('name',name.trim());
    const r=await fetch('/api/family/start',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok || !d.ok) return alert(d.error || 'Family બનાવી શકાઈ નથી');
    alert('Family બની ગઈ! Family ID: '+d.familyId);
    await loadFamilies();
    const box=document.getElementById('families');
    const btn=[...box.querySelectorAll('button')].find(b=>b.textContent.includes('Tree જુઓ'));
    if(btn) btn.click();
  }catch(e){
    alert('Family બનાવતી વખતે error: '+e.message);
  }
} async function loadFamilies() {
  key = sessionStorage.getItem('adminKey') || key;
  if (!key) { $('app').style.display='none'; $('login').style.display='block'; return; }
  let r = await fetch('/api/admin/families', { headers:{'x-admin-key':key} });
  let d = await r.json();
  if (!r.ok || !d.ok) { alert(d.error || 'Admin password ખોટો છે'); sessionStorage.removeItem('adminKey'); key=''; $('app').style.display='none'; $('login').style.display='block'; return; }
  let box=$('families'); box.innerHTML='';
  if(!d.families.length){ box.innerHTML='<div class="empty">હજુ કોઈ family data નથી.<br><button class="btn" style="margin-top:12px" onclick="createFamily()">➕ પ્રથમ Family બનાવો</button></div>'; return; }
  d.families.forEach(f=>{ let div=document.createElement('div'); div.className='family'; div.innerHTML='<b>Family ID: '+esc(f._id)+'</b><div>સભ્યો: '+f.people+'</div><div class="family-actions"><button class="btn" onclick="viewFamily(\''+escAttr(f._id)+'\')">🌳 Tree જુઓ</button><button class="btn danger" onclick="deleteFamily(\''+escAttr(f._id)+'\')">🗑️ Delete Tree</button></div>'; box.appendChild(div); });
}
async function deleteFamily(id){
  if(!confirm('આ Family ની આખી tree અને તેના બધા members કાયમ માટે delete કરવી છે?')) return;
  try{
    const r=await fetch('/api/admin/family/'+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-key':key}});
    const d=await r.json();
    if(!r.ok || !d.ok) return alert(d.error||'Tree delete થઈ નથી');
    if(window.currentFamilyId===id){ $('viewer').style.display='none'; people=[]; }
    alert('આખી Family Tree delete થઈ ગઈ.');
    await loadFamilies();
  }catch(e){ alert('Delete error: '+e.message); }
}
async function deleteCurrentFamily(){ if(window.currentFamilyId) await deleteFamily(window.currentFamilyId); }
async function viewFamily(id){
  window.currentFamilyId=id;
  let r=await fetch('/api/family/'+encodeURIComponent(id)),d=await r.json();
  if(!d.ok)return alert(d.error);
  people=d.people;
  $('viewer').style.display='block';
  renderTree();
  $('viewer').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(focusTreeRoot,100);
}
function focusTreeRoot(){
  const box=$('treebox');
  const root=people.find(p=>!p.parentId);
  if(!box||!root||!root.__pos)return;
  box.scrollTo({left:Math.max(0,root.__pos.x-25),top:Math.max(0,root.__pos.y-25),behavior:'smooth'});
}
function renderTree(){
  $('treebox').classList.remove('natural-mode');
  restoreSimpleCanvas();
  $('viewerTitle').innerHTML='🌳 Selected Family';
  let cards=$('cards'),svg=$('svg'); cards.innerHTML=''; svg.innerHTML='';
  if(!people.length)return;
  const children={};
  people.forEach(p=>(children[String(p.parentId||'root')]??=[]).push(p));
  Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt)-new Date(y.createdAt)));
  const CARD_W=190,GAP=55,LEVEL_GAP=300,ROOT_X=380,ROOT_Y=60;
  function subtreeWidth(id){const kids=children[id]||[];if(!kids.length)return CARD_W;return kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);}
  const root=people.find(p=>!p.parentId); if(!root)return;
  const pos={};
  function layout(id,x,y){
    const node=people.find(p=>String(p._id)===String(id)); if(!node)return;
    const kids=children[String(id)]||[];
    const w=subtreeWidth(String(id));
    pos[String(id)]={x:x-CARD_W/2,y};
    node.__pos={x:x-CARD_W/2,y};
    if(kids.length){let total=kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);let cur=x-total/2;kids.forEach(k=>{const kw=subtreeWidth(String(k._id));layout(String(k._id),cur+kw/2,y+LEVEL_GAP);cur+=kw+GAP;});}
  }
  layout(String(root._id),ROOT_X,ROOT_Y);
  const maxX=Math.max(1200,...Object.values(pos).map(q=>q.x+CARD_W+250));
  const maxY=Math.max(2200,...Object.values(pos).map(q=>q.y+260));
  $('canvas').style.width=maxX+'px'; $('canvas').style.height=maxY+'px'; svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  people.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    let d=document.createElement('div'); d.className='card'; d.style.left=q.x+'px'; d.style.top=q.y+'px';
    let link=addLink(p.addToken);
    d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+esc(p.name)+'</b><small>Generation '+p.generation+'</small><div class="member-tools"><input class="member-link" value="'+esc(link)+'" readonly><div class="tool-row"><button class="btn" onclick="copyLink(\''+escAttr(link)+'\')">🔗 Copy Link</button><button class="btn gray" onclick="editName(\''+escAttr(p._id)+'\')">✏️ Name</button></div></div>';
    cards.appendChild(d);
  });
  people.forEach(p=>{if(!p.parentId)return;const a=pos[String(p.parentId)],b=pos[String(p._id)];if(a&&b)draw(svg,a.x+CARD_W/2,a.y+170,b.x+CARD_W/2,b.y);});
  renderMemberLinks();
}

function renderNaturalTree(){
  const box=$('treebox'); box.classList.add('natural-mode');
  const canvas=$('canvas'); canvas.className='natural-canvas';
  canvas.innerHTML='<div class="canopy"></div><div class="trunk"></div><div class="roots"></div><div class="ground"></div><svg id="naturalSvg" class="natural-svg"></svg><div id="naturalCards"></div><div class="natural-tools"><button class="btn gray" onclick="renderTree()">▦ Simple</button><button class="btn danger" onclick="deleteCurrentFamily()">🗑️ Delete Tree</button></div>';
  const svg=document.getElementById('naturalSvg'), cards=document.getElementById('naturalCards');
  if(!people.length)return;
  const root=people.find(p=>!p.parentId); if(!root)return;
  const children={}; people.forEach(p=>(children[String(p.parentId||'root')]??=[]).push(p));
  Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt)-new Date(y.createdAt)));
  const maxGen=Math.max(...people.map(p=>Number(p.generation)||1));
  const W=Math.max(2600, Math.min(4200, 1250 + people.length*150));
  const H=Math.max(1900, 1050 + maxGen*250);
  canvas.style.width=W+'px'; canvas.style.height=H+'px'; svg.setAttribute('width',W); svg.setAttribute('height',H);
  const center=W/2, pos={};
  const ns='http://www.w3.org/2000/svg';
  function addPath(parent, child, gen){
    const a=pos[String(parent._id)], b=pos[String(child._id)]; if(!a||!b)return;
    const p=document.createElementNS(ns,'path');
    const width=Math.max(10,34-(gen*4));
    let x1=a.x, y1=a.y, x2=b.x, y2=b.y;
    const bend=y1+(y2-y1)*.48;
    p.setAttribute('d',`M ${x1} ${y1} C ${x1+(x2-x1)*.10} ${bend-120}, ${x2-(x2-x1)*.10} ${bend+100}, ${x2} ${y2}`);
    p.setAttribute('fill','none'); p.setAttribute('stroke','#633918'); p.setAttribute('stroke-width',width); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round'); svg.appendChild(p);
    const hi=document.createElementNS(ns,'path');
    hi.setAttribute('d',p.getAttribute('d')); hi.setAttribute('fill','none'); hi.setAttribute('stroke','#a16b39'); hi.setAttribute('stroke-width',Math.max(3,width*.25)); hi.setAttribute('stroke-linecap','round'); svg.appendChild(hi);
  }
  // Root / grandfather lives visually inside the trunk.
  pos[String(root._id)]={x:center,y:1390}; root.__naturalPos=pos[String(root._id)];
  // Lay out every generation as a natural layer: children on branches, grandchildren on leaves.
  const groups={}; people.forEach(p=>{const g=Number(p.generation)||1;(groups[g]??=[]).push(p)});
  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach(g=>{
    if(g===1)return;
    const arr=groups[g];
    const y = g===2 ? 1040 : Math.max(230, 1040-(g-2)*245);
    const spread=Math.min(W-700, Math.max(720,(arr.length-1)*250));
    const start=center-spread/2;
    arr.forEach((p,i)=>{
      const x=arr.length===1?center:start+i*(spread/(arr.length-1));
      pos[String(p._id)]={x,y}; p.__naturalPos=pos[String(p._id)];
    });
  });
  // If there is no generation field consistency, place generation-1 members on the main branches.
  (groups[1]||[]).forEach((p,i,arr)=>{
    const spread=Math.min(W-900,Math.max(700,(arr.length-1)*380));
    const x=arr.length===1?center:center-spread/2+i*(spread/(arr.length-1));
    pos[String(p._id)]={x,y:720}; p.__naturalPos=pos[String(p._id)];
  });
  // Draw branch network first: trunk -> branch -> leaf.
  people.forEach(p=>{if(!p.parentId)return;const parent=people.find(x=>String(x._id)===String(p.parentId));if(parent)addPath(parent,p,Number(p.generation)||1)});
  // Add short leaf twigs behind leaf cards.
  people.filter(p=>(Number(p.generation)||1)>=2).forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    const twig=document.createElementNS(ns,'path');
    twig.setAttribute('d',`M ${q.x} ${q.y+70} C ${q.x} ${q.y+35} ${q.x+(q.x<center?-22:22)} ${q.y+18} ${q.x+(q.x<center?-34:34)} ${q.y-4}`);
    twig.setAttribute('fill','none'); twig.setAttribute('stroke','#765025'); twig.setAttribute('stroke-width','8'); twig.setAttribute('stroke-linecap','round'); svg.appendChild(twig);
  });
  people.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    const g=Number(p.generation)||1;
    const d=document.createElement('div');
    d.className='natural-card '+(p._id===root._id?'trunk-card':(g>=2?'leaf-card':'branch-card'));
    const w=p._id===root._id?105:g>=2?72:79;
    const h=p._id===root._id?145:g>=2?96:112;
    d.style.left=(q.x-w/2)+'px'; d.style.top=(q.y-h/2)+'px';
    d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+esc(p.name)+'</b><small>'+(p._id===root._id?'👑 Grand Father / Main Person':g===1?'🌿 Child / Branch':'🍃 Generation '+esc(g))+'</small>';
    cards.appendChild(d);
  });
  $('viewerTitle').innerHTML='🌳 Real Family Tree';
  setTimeout(()=>{$('treebox').scrollLeft=Math.max(0,center-$('treebox').clientWidth/2);$('treebox').scrollTop=Math.max(0,900-$('treebox').clientHeight/2)},60);
}
