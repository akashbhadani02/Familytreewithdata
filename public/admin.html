<!doctype html>
<html lang="gu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Family Tree Admin</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #203047
        }

        header {
            background: #fff;
            border-bottom: 1px solid #dce4ec;
            padding: 16px;
            text-align: center
        }

        header h1 {
            margin: 0
        }

        .wrap {
            max-width: 1250px;
            margin: 18px auto;
            padding: 0 14px
        }

        .panel {
            background: #fff;
            border: 1px solid #dce4ec;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 28px #20304712;
            margin-bottom: 18px
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        input {
            padding: 12px;
            border: 1px solid #cbd6e2;
            border-radius: 10px;
            font-size: 15px
        }

        .btn {
            padding: 11px 15px;
            border: 0;
            border-radius: 10px;
            background: #315f91;
            color: #fff;
            font-weight: 800;
            cursor: pointer
        }

        .btn.gray {
            background: #e9eef4;
            color: #30445b
        }

        .btn.danger {
            background: #dc3545;
            color: #fff
        }

        .btn.danger:hover {
            filter: brightness(.95)
        }

        .families {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px
        }

        .family {
            border: 1px solid #dce4ec;
            border-radius: 12px;
            padding: 14px
        }

        .family-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.family-actions .btn{flex:1;min-width:120px}.family b {
            display: block;
            margin-bottom: 6px
        }

        .treebox {
            overflow: auto;
            border: 1px solid #dce4ec;
            border-radius: 14px;
            height: 680px
        }

        .canvas {
            position: relative;
            width: 7000px;
            height: 5000px;
            background: #fbfcfe
        }

        .card {
            position: absolute;
            width: 190px;
            background: #fff;
            border: 1px solid #cbd7e4;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 5px 18px #24384e18;
            z-index: 2
        }

        .card img {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0e7ef
        }

        .card b {
            display: block;
            font-size: 14px;
            margin-top: 6px
        }

        .card small {
            display: block;
            color: #718096;
            font-size: 10px;
            margin-top: 3px
        }

        /* Clean parent-child connectors: lines stay only in the gap between cards. */
        #svg { pointer-events:none; }
        #svg path {
            stroke: #7b8da3 !important;
            stroke-width: 3 !important;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none !important;
        }
        .treebox { -webkit-overflow-scrolling: touch; }
        @media (max-width: 700px) {
            header h1 { font-size: 20px; }
            .wrap { padding: 0 8px; margin: 10px auto; }
            .panel { padding: 12px; border-radius: 12px; }
            .treebox { height: 560px; }
            .canvas { width: 7000px; height: 5000px; }
            .card { width: 190px; }
            #svg path { stroke-width: 3 !important; }
            .member-list { grid-template-columns: 1fr; }
            .row .btn { min-height: 42px; }
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #718096
        }

        .danger {
            background: #b53a3a
        }


        .member-tools { margin-top:8px; padding-top:8px; border-top:1px solid #edf1f5; }
        .member-link { width:100%; font-size:11px; padding:8px; border:1px solid #d8e1eb; border-radius:8px; background:#f7f9fc; }
        .tool-row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
        .tool-row .btn { padding:7px 9px; font-size:11px; }
        .links-panel { margin-top:16px; border-top:1px solid #e2e8f0; padding-top:14px; }
        .member-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; margin-top:10px; }
        .member-item { border:1px solid #dce4ec; border-radius:12px; padding:12px; background:#fbfcfe; }
        .member-item .name { font-weight:800; }
        .member-item small { color:#718096; display:block; margin:3px 0 8px; }

        .status {
            margin-top: 10px;
            color: #315f91;
            font-size: 13px
        }

        /* =========================
           TRUE BOTANICAL FAMILY TREE
           Oldest person = trunk base. Each generation grows upward.
           Children are leaves at branch tips.
        ========================== */
        .treebox.natural-mode{
          background:linear-gradient(#fbfcf8 0%,#f8faf3 72%,#eef4e7 100%);
          overflow:auto;min-height:760px;border-radius:16px;padding:0;
        }
        .natural-canvas{position:relative;width:3400px;height:2300px;overflow:hidden;background:linear-gradient(#fbfcf7,#f5f8ee 72%,#e8efdf)}
        .natural-canvas .ground{position:absolute;left:0;right:0;bottom:-70px;height:170px;background:radial-gradient(ellipse at 50% 20%,#a9c58a 0,#c8d9b3 40%,transparent 72%);z-index:1}
        /* No artificial green canopy: the brown silhouette itself is the tree. */
        .natural-canvas .canopy{display:none}
        .natural-canvas .trunk{
          position:absolute;left:50%;bottom:85px;width:260px;height:1260px;transform:translateX(-50%);z-index:3;
          background:linear-gradient(90deg,#3f260d 0%,#5a3814 13%,#744a1d 29%,#4c2f10 43%,#7f5522 57%,#573510 72%,#6e451b 88%,#3a220b 100%);
          clip-path:polygon(39% 0,61% 0,66% 8%,64% 25%,67% 43%,63% 63%,69% 82%,78% 96%,100% 100%,0 100%,22% 96%,34% 82%,38% 63%,36% 43%,39% 25%,34% 8%);
          box-shadow:inset 24px 0 24px rgba(20,10,2,.28),inset -22px 0 24px rgba(20,10,2,.2);
        }
        .natural-canvas .trunk:before,.natural-canvas .trunk:after{content:"";position:absolute;top:30px;bottom:90px;width:8px;border-radius:50%;background:rgba(35,18,5,.24)}
        .natural-canvas .trunk:before{left:82px;transform:rotate(4deg)}.natural-canvas .trunk:after{right:84px;transform:rotate(-3deg)}
        .natural-canvas .roots{position:absolute;left:50%;bottom:28px;width:1200px;height:230px;transform:translateX(-50%);z-index:2;background:radial-gradient(ellipse at 50% 35%,#573411 0 18%,transparent 20%),radial-gradient(ellipse at 15% 70%,#70461a 0 11%,transparent 13%),radial-gradient(ellipse at 85% 70%,#70461a 0 11%,transparent 13%),radial-gradient(ellipse at 3% 94%,#835c27 0 7%,transparent 9%),radial-gradient(ellipse at 97% 94%,#835c27 0 7%,transparent 9%)}
        .natural-canvas .natural-svg{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:visible}
        .natural-card{position:absolute;width:150px;min-height:102px;padding:7px;text-align:center;background:#fff;border:3px solid #fff;border-radius:50%;box-shadow:0 6px 16px rgba(40,55,25,.18);z-index:12;transform:translateZ(0)}
        .natural-card img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.18)}
        .natural-card b{display:block;margin-top:3px;font-size:12px;color:#26351e}.natural-card small{display:block;margin-top:1px;color:#4b8242;font-weight:700;font-size:10px}
        .natural-card.trunk-card{width:205px;min-height:138px;border:4px solid #7b531d;border-radius:24px;background:#fffdf5;box-shadow:0 8px 22px rgba(50,35,10,.2)}
        .natural-card.trunk-card img{width:72px;height:72px}.natural-card.trunk-card:before{content:"♛";position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:24px;color:#8b671e}
        .natural-card.branch-card{width:145px;min-height:98px;border-radius:50%;border-color:#d9c9a7;background:#fffdf8}
        .natural-card.leaf-card{width:128px;min-height:88px;border:3px solid #7ea95a;border-radius:65% 35% 65% 35% / 55% 65% 35% 45%;background:linear-gradient(145deg,#f9fff2,#dceec9);box-shadow:0 6px 14px rgba(45,85,30,.16)}
        .natural-card.leaf-card img{width:46px;height:46px}.natural-card.leaf-card b{font-size:11px}.natural-card.leaf-card small{font-size:9px}
        .natural-tools{position:absolute;top:16px;right:18px;z-index:30;display:flex;gap:8px;flex-wrap:wrap}.natural-tools .btn{box-shadow:0 4px 12px rgba(0,0,0,.1)}
        @media(max-width:700px){
          .natural-canvas{width:2500px;height:2050px}.natural-canvas .trunk{width:205px;height:1110px}.natural-canvas .roots{width:760px;height:190px}.natural-card{width:132px;min-height:96px}.natural-card img{width:52px;height:52px}.natural-card.trunk-card{width:175px;min-height:125px}.natural-card.trunk-card img{width:66px;height:66px}.natural-tools{left:12px;right:auto;top:12px}
        }
    </style>
</head>

<body>
    <header>
        <h1>🌳 Family Tree Admin</h1>
    </header>
    <div class="wrap">
        <div id="login" class="panel">
            <h2>Admin Login</h2>
            <div class="row"><input id="key" type="password" placeholder="Admin password"><button class="btn"
                    onclick="login()">Login</button></div>
            <div class="status">Admin password: call on 9106141725 </div>
        </div>
        <div id="app" style="display:none">
            <div class="panel">
                <div class="row"><button class="btn" onclick="loadFamilies()">🔄 Refresh</button><button class="btn" onclick="createFamily()">➕ નવી Family બનાવો</button><button
                        class="btn gray" onclick="logout()">Logout</button></div>
                <div id="families" class="families" style="margin-top:14px"></div>
            </div>
            <div id="viewer" class="panel" style="display:none">
                <div class="row">
                    <h2 id="viewerTitle" style="margin:0;flex:1">🌳 Selected Family</h2><button class="btn gray" onclick="renderTree()">▦ Simple Tree</button><button class="btn" onclick="renderNaturalTree()">🌳 Real Tree</button><button class="btn" onclick="downloadPNG()">🖼️ Download PNG</button><button class="btn danger" onclick="deleteCurrentFamily()">🗑️ આખી Tree Delete</button>
                </div>
                <div id="treebox" class="treebox">
                    <div id="canvas" class="canvas"><svg id="svg" width="8000" height="4500"
                            style="position:absolute;left:0;top:0;z-index:1"></svg>
                        <div id="cards"></div>
                    </div>
                </div>
                <div class="links-panel">
                    <h3 style="margin:0">🔗 બધા Members ની Links</h3>
                    <div style="font-size:13px;color:#718096;margin-top:5px">Admin અહીંથી કોઈપણ member નું નામ બદલી શકે છે અને તેની link copy/share કરી શકે છે. Name બદલવાથી link બદલાશે નહીં.</div>
                    <div id="memberLinks" class="member-list"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let key = '', people = []; const $ = id => document.getElementById(id);
function showAdminApp() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
}
function login() {
  const entered = $('key').value.trim();
  if (!entered) return;
  key = entered;
  sessionStorage.setItem('adminKey', key);
  showAdminApp();
  loadFamilies();
}
function logout() {
  key = '';
  sessionStorage.removeItem('adminKey');
  location.reload();
}
async function createFamily(){
  const name=prompt('નવી Family માટે પ્રથમ સભ્યનું પૂરું નામ લખો:');
  if(!name || !name.trim()) return;
  try{
    const fd=new FormData();
    fd.append('name',name.trim());
    const r=await fetch('/api/family/start',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok || !d.ok) return alert(d.error || 'Family બનાવી શકાઈ નથી');
    alert('Family બની ગઈ! Family ID: '+d.familyId);
    await loadFamilies();
    const box=document.getElementById('families');
    const btn=[...box.querySelectorAll('button')].find(b=>b.textContent.includes('Tree જુઓ'));
    if(btn) btn.click();
  }catch(e){
    alert('Family બનાવતી વખતે error: '+e.message);
  }
} async function loadFamilies() {
  key = sessionStorage.getItem('adminKey') || key;
  if (!key) { $('app').style.display='none'; $('login').style.display='block'; return; }
  let r = await fetch('/api/admin/families', { headers:{'x-admin-key':key} });
  let d = await r.json();
  if (!r.ok || !d.ok) { alert(d.error || 'Admin password ખોટો છે'); sessionStorage.removeItem('adminKey'); key=''; $('app').style.display='none'; $('login').style.display='block'; return; }
  let box=$('families'); box.innerHTML='';
  if(!d.families.length){ box.innerHTML='<div class="empty">હજુ કોઈ family data નથી.<br><button class="btn" style="margin-top:12px" onclick="createFamily()">➕ પ્રથમ Family બનાવો</button></div>'; return; }
  d.families.forEach(f=>{ let div=document.createElement('div'); div.className='family'; div.innerHTML='<b>Family ID: '+esc(f._id)+'</b><div>સભ્યો: '+f.people+'</div><div class="family-actions"><button class="btn" onclick="viewFamily(\''+escAttr(f._id)+'\')">🌳 Tree જુઓ</button><button class="btn danger" onclick="deleteFamily(\''+escAttr(f._id)+'\')">🗑️ Delete Tree</button></div>'; box.appendChild(div); });
}
async function deleteFamily(id){
  if(!confirm('આ Family ની આખી tree અને તેના બધા members કાયમ માટે delete કરવી છે?')) return;
  try{
    const r=await fetch('/api/admin/family/'+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-key':key}});
    const d=await r.json();
    if(!r.ok || !d.ok) return alert(d.error||'Tree delete થઈ નથી');
    if(window.currentFamilyId===id){ $('viewer').style.display='none'; people=[]; }
    alert('આખી Family Tree delete થઈ ગઈ.');
    await loadFamilies();
  }catch(e){ alert('Delete error: '+e.message); }
}
async function deleteCurrentFamily(){ if(window.currentFamilyId) await deleteFamily(window.currentFamilyId); }
async function viewFamily(id){
  window.currentFamilyId=id;
  let r=await fetch('/api/family/'+encodeURIComponent(id)),d=await r.json();
  if(!d.ok)return alert(d.error);
  people=d.people;
  $('viewer').style.display='block';
  renderTree();
  $('viewer').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(focusTreeRoot,100);
}
function focusTreeRoot(){
  const box=$('treebox');
  const root=people.find(p=>!p.parentId);
  if(!box||!root||!root.__pos)return;
  box.scrollTo({left:Math.max(0,root.__pos.x-25),top:Math.max(0,root.__pos.y-25),behavior:'smooth'});
}
function renderTree(){
  $('treebox').classList.remove('natural-mode');
  restoreSimpleCanvas();
  $('viewerTitle').innerHTML='🌳 Selected Family';
  let cards=$('cards'),svg=$('svg'); cards.innerHTML=''; svg.innerHTML='';
  if(!people.length)return;
  const children={};
  people.forEach(p=>(children[String(p.parentId||'root')]??=[]).push(p));
  Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt)-new Date(y.createdAt)));
  const CARD_W=190,GAP=55,LEVEL_GAP=300,ROOT_X=380,ROOT_Y=60;
  function subtreeWidth(id){const kids=children[id]||[];if(!kids.length)return CARD_W;return kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);}
  const root=people.find(p=>!p.parentId); if(!root)return;
  const pos={};
  function layout(id,x,y){
    const node=people.find(p=>String(p._id)===String(id)); if(!node)return;
    const kids=children[String(id)]||[];
    const w=subtreeWidth(String(id));
    pos[String(id)]={x:x-CARD_W/2,y};
    node.__pos={x:x-CARD_W/2,y};
    if(kids.length){let total=kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);let cur=x-total/2;kids.forEach(k=>{const kw=subtreeWidth(String(k._id));layout(String(k._id),cur+kw/2,y+LEVEL_GAP);cur+=kw+GAP;});}
  }
  layout(String(root._id),ROOT_X,ROOT_Y);
  const maxX=Math.max(1200,...Object.values(pos).map(q=>q.x+CARD_W+250));
  const maxY=Math.max(2200,...Object.values(pos).map(q=>q.y+260));
  $('canvas').style.width=maxX+'px'; $('canvas').style.height=maxY+'px'; svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  people.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    let d=document.createElement('div'); d.className='card'; d.style.left=q.x+'px'; d.style.top=q.y+'px';
    let link=addLink(p.addToken);
    d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+esc(p.name)+'</b><small>Generation '+p.generation+'</small><div class="member-tools"><input class="member-link" value="'+esc(link)+'" readonly><div class="tool-row"><button class="btn" onclick="copyLink(\''+escAttr(link)+'\')">🔗 Copy Link</button><button class="btn gray" onclick="editName(\''+escAttr(p._id)+'\')">✏️ Name</button></div></div>';
    cards.appendChild(d);
  });
  people.forEach(p=>{if(!p.parentId)return;const a=pos[String(p.parentId)],b=pos[String(p._id)];if(a&&b)draw(svg,a.x+CARD_W/2,a.y+170,b.x+CARD_W/2,b.y);});
  renderMemberLinks();
}

function renderNaturalTree(){
  const box=$('treebox'); box.classList.add('natural-mode');
  const canvas=$('canvas'); canvas.className='natural-canvas';
  canvas.innerHTML='<div class="trunk"></div><div class="roots"></div><div class="ground"></div><svg id="naturalSvg" class="natural-svg"></svg><div id="naturalCards"></div><div class="natural-tools"><button class="btn gray" onclick="renderTree()">▦ Simple</button><button class="btn danger" onclick="deleteCurrentFamily()">🗑️ Delete Tree</button></div>';
  if(!people.length)return;
  const root=people.find(p=>!p.parentId) || people.slice().sort((a,b)=>(Number(a.generation)||1)-(Number(b.generation)||1))[0];
  if(!root)return;

  const svg=document.getElementById('naturalSvg'), cards=document.getElementById('naturalCards');
  const children={};
  people.forEach(p=>{const k=String(p.parentId||'root');(children[k]??=[]).push(p);});
  Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt||0)-new Date(y.createdAt||0)));

  // Build the real hierarchy. Level 0 is the oldest/root at the bottom.
  const levels=[], visited=new Set();
  function walk(p,level){
    if(visited.has(String(p._id))) return;
    visited.add(String(p._id)); (levels[level]??=[]).push(p);
    (children[String(p._id)]||[]).forEach(c=>walk(c,level+1));
  }
  walk(root,0);
  people.forEach(p=>{if(!visited.has(String(p._id))) walk(p,0);});

  const maxLevel=Math.max(0,levels.length-1);
  const W=Math.max(3400,Math.min(7000,2100+Math.max(0,people.length-1)*260));
  const H=Math.max(2300,1050+maxLevel*360);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  svg.setAttribute('width',W); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const center=W/2, pos={};
  // Root is the trunk base. Every generation grows upward.
  const rootY=H-430;
  const topY=260;
  const levelGap=maxLevel?Math.max(300,(rootY-topY)/maxLevel):360;

  // Calculate subtree width so brothers get their own natural branch space.
  const sub={};
  function width(p){
    const kids=children[String(p._id)]||[];
    if(!kids.length){sub[String(p._id)]=1;return 1;}
    sub[String(p._id)]=Math.max(1,kids.reduce((n,c)=>n+width(c),0)); return sub[String(p._id)];
  }
  width(root);

  function place(p,left,right,level){
    const kids=children[String(p._id)]||[];
    if(!kids.length)return;
    const total=kids.reduce((n,c)=>n+sub[String(c._id)],0);
    let cur=left;
    kids.forEach(c=>{
      const span=(right-left)*(sub[String(c._id)]/total);
      const x=cur+span/2;
      pos[String(c._id)]={x,y:rootY-level*levelGap};
      place(c,cur,cur+span,level+1); cur+=span;
    });
  }
  pos[String(root._id)]={x:center,y:rootY};
  place(root,260,W-260,1);

  // Draw a thick organic branch from parent to child. Thickness decreases by generation.
  const ns='http://www.w3.org/2000/svg';
  function branch(parent,child,level){
    const a=pos[String(parent._id)], b=pos[String(child._id)]; if(!a||!b)return;
    const dx=b.x-a.x, dy=b.y-a.y;
    const c1x=a.x+dx*.08, c1y=a.y+dy*.36;
    const c2x=b.x-dx*.08, c2y=b.y-dy*.28;
    const p=document.createElementNS(ns,'path');
    p.setAttribute('d',`M ${a.x} ${a.y-45} C ${c1x} ${c1y} ${c2x} ${c2y} ${b.x} ${b.y+42}`);
    p.setAttribute('fill','none'); p.setAttribute('stroke','#4b2c0d');
    const sw=Math.max(7,42-level*6); p.setAttribute('stroke-width',sw); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round'); svg.appendChild(p);
    const hi=document.createElementNS(ns,'path'); hi.setAttribute('d',p.getAttribute('d')); hi.setAttribute('fill','none'); hi.setAttribute('stroke','#8a5a22'); hi.setAttribute('stroke-width',Math.max(2,sw*.25)); hi.setAttribute('stroke-linecap','round'); svg.appendChild(hi);
  }
  function drawTree(p,level){(children[String(p._id)]||[]).forEach(c=>{branch(p,c,level+1);drawTree(c,level+1);});}
  drawTree(root,0);

  // Small natural twigs beyond the last child; they stop exactly at the last generation.
  const last=levels[maxLevel]||[];
  last.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    const dir=q.x<center?-1:1;
    const twig=document.createElementNS(ns,'path');
    twig.setAttribute('d',`M ${q.x} ${q.y+38} C ${q.x+dir*8} ${q.y-10} ${q.x+dir*38} ${q.y-35} ${q.x+dir*68} ${q.y-58}`);
    twig.setAttribute('fill','none');twig.setAttribute('stroke','#644014');twig.setAttribute('stroke-width','7');twig.setAttribute('stroke-linecap','round');svg.appendChild(twig);
  });

  // Member cards are leaves for children; only the oldest/root sits in the trunk.
  function levelOf(id){for(let i=0;i<levels.length;i++)if(levels[i].some(x=>String(x._id)===String(id)))return i;return 0;}
  people.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    const lv=levelOf(p._id), isRoot=String(p._id)===String(root._id), isLeaf=lv===maxLevel && !(children[String(p._id)]||[]).length;
    const d=document.createElement('div'); d.className='natural-card '+(isRoot?'trunk-card':(isLeaf?'leaf-card':'branch-card'));
    const w=isRoot?205:(isLeaf?128:145), h=isRoot?138:(isLeaf?88:98);
    d.style.left=(q.x-w/2)+'px'; d.style.top=(q.y-h/2)+'px';
    d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+esc(p.name)+'</b><small>'+(isRoot?'Grand Father / Main Person':isLeaf?'Child / Last Generation':'Father / Branch')+'</small>';
    cards.appendChild(d);
  });

  $('viewerTitle').innerHTML='🌳 Real Natural Family Tree';
  setTimeout(()=>{
    const tb=$('treebox'); tb.scrollLeft=Math.max(0,center-tb.clientWidth/2); tb.scrollTop=Math.max(0,rootY-tb.clientHeight+220);
  },80);
}
