<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>અમારું પરિવાર વૃક્ષ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#203047}header{background:#fff;border-bottom:1px solid #dce4ec;padding:16px;text-align:center}header h1{margin:0;font-size:24px}.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.panel{background:#fff;border:1px solid #dce4ec;border-radius:16px;padding:20px;box-shadow:0 8px 28px #20304712}.center{text-align:center}.title{font-size:20px;font-weight:800;margin-bottom:8px}.sub{font-size:13px;color:#68778a;line-height:1.6}.form{max-width:520px;margin:18px auto}.label{font-weight:800;font-size:13px;margin:14px 0 6px;display:block}input[type=text]{width:100%;padding:14px;border:1px solid #cbd6e2;border-radius:10px;font-size:16px}input[type=file]{width:100%;padding:12px;border:1px dashed #cbd6e2;border-radius:10px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#315f91;color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:15px}.btn.secondary{background:#e9eef4;color:#30445b}.preview{width:100px;height:100px;border-radius:50%;object-fit:cover;display:none;margin:10px auto}.success{background:#edf8f1;border:1px solid #b9e2c8;padding:15px;border-radius:10px;margin-top:16px;text-align:center;display:none}.linkbox{word-break:break-all;background:#f3f6fa;padding:10px;border-radius:8px;margin-top:8px;font-size:12px}.treebox{margin-top:18px;background:#fff;border:1px solid #dce4ec;border-radius:16px;overflow:auto;height:650px}.canvas{position:relative;width:10000px;height:5200px;background:#fbfcfe}.card{position:absolute;width:190px;background:#fff;border:1px solid #cbd7e4;border-radius:14px;padding:10px;text-align:center;box-shadow:0 5px 18px #24384e18;z-index:2}.card img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #e0e7ef}.card b{display:block;font-size:14px;margin-top:6px;white-space:normal;overflow-wrap:anywhere}.card small{display:block;color:#718096;font-size:10px;margin-top:3px}.card .relation{color:#718096}.card .personLink{display:block;margin-top:8px;font-size:11px;color:#315f91;cursor:pointer;text-decoration:underline}.line{position:absolute;background:#71849a;height:3px;transform-origin:0 0;z-index:1}.hidden{display:none}.copy{font-size:12px;color:#315f91;cursor:pointer;text-decoration:underline;margin-top:7px}.topActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.topActions button{width:auto;padding:10px 14px;font-size:13px}.note{font-size:12px;background:#fff7df;border:1px solid #ead89c;border-radius:10px;padding:10px;margin-top:12px}.nextBox{margin-top:12px;background:#eef5ff;border:1px solid #c8ddf5;padding:12px;border-radius:10px}.nextBox b{display:block;margin-bottom:5px}
</style></head>
<body>
<header><h1>🌳 અમારું પરિવાર વૃક્ષ</h1><div style="margin-top:10px"><a href="/" style="text-decoration:none;color:#315f91;font-weight:800">➕ નવી Family શરૂ કરો</a> <span style="color:#9aa6b2">|</span> <a href="/admin" style="text-decoration:none;color:#315f91;font-weight:800">🔐 Admin</a></div></header>
<div class="wrap">
<div id="rootBox" class="panel hidden"><div class="center title">પરિવારની શરૂઆત કરો</div><div class="center sub">સૌથી પહેલા પરિવારના સૌથી મોટા/જૂના સભ્યનું પૂરું નામ લખો. પછી તેમને મળેલી link તેમના દીકરા/આગળના સભ્યને મોકલો.</div><div class="form"><label class="label">પૂરું નામ</label><input id="rootName" type="text" placeholder="ઉદાહરણ: રમેશભાઈ પટેલ"><label class="label">ફોટો (ઇચ્છા હોય તો)</label><input id="rootPhoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="showPreview(this,'rootPreview')"><img id="rootPreview" class="preview"><button class="btn" onclick="createRoot()">✅ પરિવાર વૃક્ષ શરૂ કરો</button><div id="rootSuccess" class="success"></div></div></div>
<div id="addBox" class="panel hidden"><div class="center title">પરિવારમાં તમારું નામ ઉમેરો</div><div class="center sub" id="parentText"></div><div class="form"><label class="label">તમારું પૂરું નામ</label><input id="addName" type="text" placeholder="ઉદાહરણ: મહેશભાઈ પટેલ"><label class="label">તમારો ફોટો (ઇચ્છા હોય તો)</label><input id="addPhoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="showPreview(this,'addPreview')"><img id="addPreview" class="preview"><button class="btn" onclick="addPerson()">✅ નામ ઉમેરો</button><div id="addSuccess" class="success"></div></div></div>
<div id="viewBox" class="panel hidden"><div class="center title">🌳 પરિવાર વૃક્ષ</div><div class="center sub">દરેક સભ્યના card પરની 🔗 link તે સભ્યના દીકરા/આગળના પરિવાર સભ્ય માટે છે.</div><div class="topActions"><button class="btn secondary" onclick="copyCurrentLink()">🔗 આ link copy કરો</button><button class="btn secondary" onclick="downloadPNG()">🖼️ મોટું ફોટો download કરો</button></div><div id="currentLink" class="linkbox"></div><div class="treebox"><div id="canvas" class="canvas"><svg id="svg" width="10000" height="5200" style="position:absolute;left:0;top:0;z-index:1"></svg><div id="cards"></div></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let token=null,familyId=null,people=[];const CARD_W=190,GAP=55,LEVEL_GAP=300,START_X=4000;
function showPreview(input,id){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{$(id).src=e.target.result;$(id).style.display='block'};r.readAsDataURL(f)}
function absoluteLink(path){return location.origin+path}
function copyText(text){navigator.clipboard.writeText(text).then(()=>alert('Link copy થઈ ગઈ')).catch(()=>prompt('આ link copy કરો:',text))}
function safe(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){const m=location.pathname.match(/^\/add\/([^/]+)$/);if(m){token=m[1];const r=await fetch('/api/add/'+token);const d=await r.json();if(!d.ok){document.body.innerHTML='<div style="padding:40px;text-align:center">આ link સાચી નથી અથવા expire થઈ ગઈ છે.</div>';return}familyId=d.parent.familyId;$('addBox').classList.remove('hidden');$('parentText').innerHTML='આ નામ <b>'+safe(d.parent.name)+'</b>ના પરિવાર tree માં તેમની નીચે ઉમેરાશે.';loadFamily();}else{const q=new URLSearchParams(location.search);familyId=q.get('family');if(familyId){$('viewBox').classList.remove('hidden');$('currentLink').textContent=location.href;loadFamily()}else $('rootBox').classList.remove('hidden')}}
async function createRoot(){const name=$('rootName').value.trim();if(!name)return alert('કૃપા કરીને નામ લખો');const fd=new FormData();fd.append('name',name);if($('rootPhoto').files[0])fd.append('photo',$('rootPhoto').files[0]);const r=await fetch('/api/family/start',{method:'POST',body:fd});const d=await r.json();if(!d.ok)return alert(d.error);familyId=d.familyId;token=d.person.addToken;const link=absoluteLink(d.addLink);$('rootSuccess').style.display='block';$('rootSuccess').innerHTML='<b>નામ સાચવાઈ ગયું! 🎉</b><div>હવે આ link '+safe(name)+'ના દીકરા/આગળના સભ્યને મોકલો:</div><div class="linkbox">'+safe(link)+'</div><div class="copy" onclick="copyText('+JSON.stringify(link)+')">Link copy કરો</div>';history.replaceState({},'', '/?family='+encodeURIComponent(familyId));$('rootBox').classList.add('hidden');$('viewBox').classList.remove('hidden');$('currentLink').textContent=link;loadFamily()}
async function addPerson(){const name=$('addName').value.trim();if(!name)return alert('કૃપા કરીને તમારું પૂરું નામ લખો');if(!token)return alert('આ add link મળતી નથી');const fd=new FormData();fd.append('name',name);if($('addPhoto').files[0])fd.append('photo',$('addPhoto').files[0]);const r=await fetch('/api/add/'+token,{method:'POST',body:fd});const d=await r.json();if(!d.ok)return alert(d.error);const link=absoluteLink(d.addLink);token=d.person.addToken;$('addSuccess').style.display='block';$('addSuccess').innerHTML='<b>'+safe(name)+'નું નામ ઉમેરાઈ ગયું! 🎉</b><div class="nextBox"><b>હવે સૌથી મહત્વનું:</b>'+safe(name)+'ના દીકરા/આગળના સભ્યને આ નવી link મોકલો:<div class="linkbox">'+safe(link)+'</div><div class="copy" onclick="copyText('+JSON.stringify(link)+')">🔗 નવી link copy કરો</div></div>'; $('addName').value='';$('addPhoto').value='';$('addPreview').style.display='none';$('parentText').innerHTML='હવે આગળનું નામ <b>'+safe(name)+'</b>ની નીચે ઉમેરાશે.';loadFamily()}
async function loadFamily(){if(!familyId)return;const r=await fetch('/api/family/'+encodeURIComponent(familyId));const d=await r.json();if(d.ok){people=d.people;renderTree()}}
function renderTree(){const cards=$('cards'),svg=$('svg');cards.innerHTML='';svg.innerHTML='';if(!people.length)return;
 const children={};people.forEach(p=>(children[p.parentId||'root']??=[]).push(p));Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt)-new Date(y.createdAt)));
 const pos={};
 function subtreeWidth(id){const kids=children[id]||[];if(!kids.length)return CARD_W;if(kids.length===1)return subtreeWidth(String(kids[0]._id));return kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1)}
 function layout(nodeId,x,y){const node=people.find(p=>String(p._id)===String(nodeId));if(!node)return;const kids=children[String(node._id)]||[];const w=subtreeWidth(String(node._id));pos[String(node._id)]={x:x-CARD_W/2,y};if(kids.length){let total=kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);let cur=x-total/2;kids.forEach(k=>{const kw=subtreeWidth(String(k._id));layout(String(k._id),cur+kw/2,y+LEVEL_GAP);cur+=kw+GAP})}}
 const root=people.find(p=>!p.parentId);if(!root)return;layout(String(root._id),START_X,80);
 people.forEach(p=>{const q=pos[String(p._id)];const d=document.createElement('div');d.className='card';d.style.left=q.x+'px';d.style.top=q.y+'px';const link=absoluteLink('/add/'+p.addToken);d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+safe(p.name)+'</b><small class="relation">Generation '+p.generation+'</small><span class="personLink" data-link="'+safe(link)+'">🔗 '+(children[String(p._id)]?'આગળનું નામ ઉમેરો':'આ સભ્યનો દીકરો ઉમેરવા link')+'</span>';d.querySelector('.personLink').onclick=()=>copyText(link);cards.appendChild(d)});
 people.forEach(p=>{if(!p.parentId)return;const a=pos[String(p.parentId)],b=pos[String(p._id)];if(a&&b)draw(svg,a.x+CARD_W/2,a.y+145,b.x+CARD_W/2,b.y)})}
function draw(svg,x1,y1,x2,y2){const ns='http://www.w3.org/2000/svg',p=document.createElementNS(ns,'path'),m=(y1+y2)/2;p.setAttribute('d',`M${x1} ${y1} L${x1} ${m} L${x2} ${m} L${x2} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#71849a');p.setAttribute('stroke-width','4');svg.appendChild(p)}
function avatar(n){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#e7edf5"/><text x="50" y="62" text-anchor="middle" font-size="42" font-family="Arial" font-weight="700" fill="#61758e">${(n||'?')[0].toUpperCase()}</text></svg>`)}
function copyCurrentLink(){copyText(location.href)}
async function downloadPNG(){if(!people.length)return alert('Tree ખાલી છે');if(!window.html2canvas){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';document.head.appendChild(s);await new Promise(r=>s.onload=r)}const c=await html2canvas($('canvas'),{scale:2,backgroundColor:'#fbfcfe'}),a=document.createElement('a');a.download='family-tree.png';a.href=c.toDataURL('image/png');a.click()}
init();
</script></body></html>
