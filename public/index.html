<!doctype html>
<html lang="gu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>અમારું પરિવાર વૃક્ષ</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #203047
        }

        header {
            background: #fff;
            border-bottom: 1px solid #dce4ec;
            padding: 16px;
            text-align: center
        }

        header h1 {
            margin: 0;
            font-size: 24px
        }

        .wrap {
            max-width: 1100px;
            margin: 18px auto;
            padding: 0 14px
        }

        .panel {
            background: #fff;
            border: 1px solid #dce4ec;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 28px #20304712
        }

        .center {
            text-align: center
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px
        }

        .sub {
            font-size: 13px;
            color: #68778a;
            line-height: 1.6
        }

        .form {
            max-width: 520px;
            margin: 18px auto
        }

        .label {
            font-weight: 800;
            font-size: 13px;
            margin: 14px 0 6px;
            display: block
        }

        input[type=text] {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd6e2;
            border-radius: 10px;
            font-size: 16px
        }

        input[type=file] {
            width: 100%;
            padding: 12px;
            border: 1px dashed #cbd6e2;
            border-radius: 10px
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #315f91;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px
        }

        .btn.secondary {
            background: #e9eef4;
            color: #30445b
        }

        .preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 10px auto
        }

        .success {
            background: #edf8f1;
            border: 1px solid #b9e2c8;
            padding: 15px;
            border-radius: 10px;
            margin-top: 16px;
            text-align: center;
            display: none
        }

        .linkbox {
            word-break: break-all;
            background: #f3f6fa;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 12px
        }

        .treebox {
            margin-top: 18px;
            background: #fff;
            border: 1px solid #dce4ec;
            border-radius: 16px;
            overflow: auto;
            height: 600px
        }

        .canvas {
            position: relative;
            width: 8000px;
            height: 4500px;
            background: #fbfcfe
        }

        .card {
            position: absolute;
            width: 190px;
            background: #fff;
            border: 1px solid #cbd7e4;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 5px 18px #24384e18;
            z-index: 2
        }

        .card img {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0e7ef
        }

        .card b {
            display: block;
            font-size: 14px;
            margin-top: 6px
        }

        .card small {
            display: block;
            color: #718096;
            font-size: 10px;
            margin-top: 3px
        }

        .line {
            position: absolute;
            background: #71849a;
            height: 3px;
            transform-origin: 0 0;
            z-index: 1
        }

        .hidden {
            display: none
        }

        .copy {
            font-size: 12px;
            color: #315f91;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 7px
        }

        .admin {
            margin-top: 20px
        }

        .topActions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap
        }

        .topActions button {
            width: auto;
            padding: 10px 14px;
            font-size: 13px
        }

        .note {
            font-size: 12px;
            background: #fff7df;
            border: 1px solid #ead89c;
            border-radius: 10px;
            padding: 10px;
            margin-top: 12px
        }
    </style>
</head>

<body>
    <header>
        <h1>🌳 અમારું પરિવાર વૃક્ષ</h1>
        <div style="margin-top:10px"><a href="/" style="text-decoration:none;color:#315f91;font-weight:800">➕ નવી Family
                શરૂ કરો</a> <span style="color:#9aa6b2">|</span> <a href="/admin"
                style="text-decoration:none;color:#315f91;font-weight:800">🔐 Admin</a></div>
    </header>
    <div class="wrap">
        <div id="rootBox" class="panel hidden">
            <div class="center title">પરિવારની શરૂઆત કરો</div>
            <div class="center sub">સૌથી પહેલા પરિવારના સૌથી મોટા/જૂના સભ્યનું પૂરું નામ લખો. પછી તેમને મળેલી link તેમના
                દીકરાને મોકલો.</div>
            <div class="form"><label class="label">પૂરું નામ</label><input id="rootName" type="text"
                    placeholder="ઉદાહરણ: રમેશભાઈ પટેલ"><label class="label">ફોટો (ઇચ્છા હોય તો)</label><input
                    id="rootPhoto" type="file" accept="image/jpeg,image/png,image/webp"
                    onchange="showPreview(this,'rootPreview')"><img id="rootPreview" class="preview"><button class="btn"
                    onclick="createRoot()">✅ પરિવાર વૃક્ષ શરૂ કરો</button>
                <div id="rootSuccess" class="success"></div>
            </div>
        </div>
        <div id="addBox" class="panel hidden">
            <div class="center title">તમારું પૂરું નામ લખો</div>
            <div class="center sub" id="parentText"></div>
            <div class="form"><label class="label">તમારું પૂરું નામ</label><input id="addName" type="text"
                    placeholder="ઉદાહરણ: મહેશભાઈ પટેલ"><label class="label">તમારો ફોટો (ઇચ્છા હોય તો)</label><input
                    id="addPhoto" type="file" accept="image/jpeg,image/png,image/webp"
                    onchange="showPreview(this,'addPreview')"><img id="addPreview" class="preview"><button class="btn"
                    onclick="addPerson()">✅ નામ ઉમેરો</button>
                <div id="addSuccess" class="success"></div>
            </div>
        </div>
        <div id="viewBox" class="panel hidden">
            <div class="center title">🌳 પરિવાર વૃક્ષ</div>
            <div class="center sub">આ link જેને મોકલશો, તે વ્યક્તિ આગળના પરિવાર સભ્યનું નામ ઉમેરી શકશે.</div>
            <div class="topActions"><button class="btn secondary" onclick="copyCurrentLink()">🔗 આ link copy
                    કરો</button><button class="btn secondary" onclick="downloadPNG()">🖼️ મોટું ફોટો download
                    કરો</button></div>
            <div id="currentLink" class="linkbox"></div>
            <div class="treebox">
                <div id="canvas" class="canvas"><svg id="svg" width="8000" height="4500"
                        style="position:absolute;left:0;top:0;z-index:1"></svg>
                    <div id="cards"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id); let token = null, familyId = null, people = [];
        function showPreview(input, id) { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = e => { $(id).src = e.target.result; $(id).style.display = 'block' }; r.readAsDataURL(f) }
        function absoluteLink(path) { return location.origin + path }
        async function init() { const m = location.pathname.match(/^\/add\/([^/]+)$/); if (m) { token = m[1]; let r = await fetch('/api/add/' + token), d = await r.json(); if (!d.ok) { document.body.innerHTML = '<div style="padding:40px;text-align:center">આ link સાચી નથી.</div>'; return } familyId = d.parent.familyId; $('addBox').classList.remove('hidden'); $('parentText').innerHTML = 'આ નામ <b>' + esc(d.parent.name) + '</b> પછી પરિવાર વૃક્ષમાં ઉમેરાશે.'; loadFamily(); } else { const q = new URLSearchParams(location.search); familyId = q.get('family'); if (familyId) { $('viewBox').classList.remove('hidden'); $('currentLink').textContent = location.href; loadFamily() } else $('rootBox').classList.remove('hidden') } }
        async function createRoot() { const name = $('rootName').value.trim(); if (!name) return alert('કૃપા કરીને નામ લખો'); const fd = new FormData(); fd.append('name', name); if ($('rootPhoto').files[0]) fd.append('photo', $('rootPhoto').files[0]); let r = await fetch('/api/family/start', { method: 'POST', body: fd }), d = await r.json(); if (!d.ok) return alert(d.error); familyId = d.familyId; const link = absoluteLink(d.addLink); $('rootSuccess').style.display = 'block'; $('rootSuccess').innerHTML = '<b>નામ સાચવાઈ ગયું! 🎉</b><div>હવે આ link તમારા દીકરા/આગળના પરિવાર સભ્યને મોકલો:</div><div class="linkbox">' + link + '</div><div class="copy" onclick="navigator.clipboard.writeText(\'' + link + '\');alert(\'Link copy થઈ ગઈ\')">Link copy કરો</div>'; $('rootBox').classList.add('hidden'); history.replaceState({}, '', '/?family=' + familyId); $('viewBox').classList.remove('hidden'); $('currentLink').textContent = location.href; loadFamily() }
        async function addPerson() { const name = $('addName').value.trim(); if (!name) return alert('કૃપા કરીને તમારું પૂરું નામ લખો'); const fd = new FormData(); fd.append('name', name); if ($('addPhoto').files[0]) fd.append('photo', $('addPhoto').files[0]); let r = await fetch('/api/add/' + token, { method: 'POST', body: fd }), d = await r.json(); if (!d.ok) return alert(d.error); const link = absoluteLink(d.addLink); $('addSuccess').style.display = 'block'; $('addSuccess').innerHTML = '<b>તમારું નામ ઉમેરાઈ ગયું! 🎉</b><div>હવે આ link તમારા દીકરા/આગળના પરિવાર સભ્યને મોકલો:</div><div class="linkbox">' + link + '</div><div class="copy" onclick="navigator.clipboard.writeText(\'' + link + '\');alert(\'Link copy થઈ ગઈ\')">Link copy કરો</div>'; $('addName').value = ''; $('addPhoto').value = ''; $('addPreview').style.display = 'none'; loadFamily() }
        async function loadFamily() { if (!familyId) return; let r = await fetch('/api/family/' + familyId), d = await r.json(); if (d.ok) { people = d.people; renderTree() } }
        function renderTree() {
            const cards = $('cards'), svg = $('svg'); cards.innerHTML = ''; svg.innerHTML = '';
            let byGen = {}; people.forEach(p => (byGen[p.generation] ??= []).push(p));
            let positions = {}; for (let g = 1; g <= 13; g++) {
                const arr = byGen[g] || [];
                arr.forEach((p, i) => { p.x = 4000 + (i - (arr.length - 1) / 2) * 240; p.y = 80 + (g - 1) * 330; positions[p._id] = p })
            }
             people.forEach(p => {
                let d = document.createElement('div');
                 d.className = 'card';
                 d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.innerHTML = '<img src="' + (p.photo || avatar(p.name)) + '"><b>' + esc(p.name) + '</b><small>સંબંધિત સભ્ય+</small> ';cards.appendChild(d)});people.forEach(p=>{if(!p.parentId)return;const a=positions[p.parentId],b=positions[p._id];if(a&&b)draw(svg,a.x+95,a.y+132,b.x+95,b.y)})}
                function draw(svg, x1, y1, x2, y2) { const ns = 'http://www.w3.org/2000/svg', p = document.createElementNS(ns, 'path'), m = (y1 + y2) / 2; p.setAttribute('d', `M${x1} ${y1} L${x1} ${m} L${x2} ${m} L${x2} ${y2}`); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#71849a'); p.setAttribute('stroke-width', '4'); svg.appendChild(p) }
                function avatar(n) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#e7edf5"/><text x="50" y="62" text-anchor="middle" font-size="42" font-family="Arial" font-weight="700" fill="#61758e">${(n || '?')[0].toUpperCase()}</text></svg>`) }
                function esc(v) { return String(v || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) }
                function copyCurrentLink() { navigator.clipboard.writeText(location.href); alert('Link copy થઈ ગઈ') }
                async function downloadPNG() { if (!people.length) return alert('Tree ખાલી છે'); if (!window.html2canvas) { let s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; document.head.appendChild(s); await new Promise(r => s.onload = r) } let c = await html2canvas($('canvas'), { scale: 2, backgroundColor: '#fbfcfe' }), a = document.createElement('a'); a.download = 'family-tree.png'; a.href = c.toDataURL('image/png'); a.click() }
                init();
    </script>
</body>

</html>
