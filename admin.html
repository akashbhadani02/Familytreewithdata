<!doctype html>
<html lang="gu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Family Tree Admin</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #203047
        }

        header {
            background: #fff;
            border-bottom: 1px solid #dce4ec;
            padding: 16px;
            text-align: center
        }

        header h1 {
            margin: 0
        }

        .wrap {
            max-width: 1250px;
            margin: 18px auto;
            padding: 0 14px
        }

        .panel {
            background: #fff;
            border: 1px solid #dce4ec;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 28px #20304712;
            margin-bottom: 18px
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        input {
            padding: 12px;
            border: 1px solid #cbd6e2;
            border-radius: 10px;
            font-size: 15px
        }

        .btn {
            padding: 11px 15px;
            border: 0;
            border-radius: 10px;
            background: #315f91;
            color: #fff;
            font-weight: 800;
            cursor: pointer
        }

        .btn.gray {
            background: #e9eef4;
            color: #30445b
        }

        .btn.danger {
            background: #dc3545;
            color: #fff
        }

        .btn.danger:hover {
            filter: brightness(.95)
        }

        .families {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px
        }

        .family {
            border: 1px solid #dce4ec;
            border-radius: 12px;
            padding: 14px
        }

        .family-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.family-actions .btn{flex:1;min-width:120px}.family b {
            display: block;
            margin-bottom: 6px
        }

        .treebox {
            overflow: auto;
            border: 1px solid #dce4ec;
            border-radius: 14px;
            height: 680px
        }

        .canvas {
            position: relative;
            width: 7000px;
            height: 5000px;
            background: #fbfcfe
        }

        .card {
            position: absolute;
            width: 190px;
            background: #fff;
            border: 1px solid #cbd7e4;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 5px 18px #24384e18;
            z-index: 2
        }

        .card img {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0e7ef
        }

        .card b {
            display: block;
            font-size: 14px;
            margin-top: 6px
        }

        .card small {
            display: block;
            color: #718096;
            font-size: 10px;
            margin-top: 3px
        }

        /* Clean parent-child connectors: lines stay only in the gap between cards. */
        #svg { pointer-events:none; }
        #svg path {
            stroke: #7b8da3 !important;
            stroke-width: 3 !important;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none !important;
        }
        .treebox { -webkit-overflow-scrolling: touch; }
        @media (max-width: 700px) {
            header h1 { font-size: 20px; }
            .wrap { padding: 0 8px; margin: 10px auto; }
            .panel { padding: 12px; border-radius: 12px; }
            .treebox { height: 560px; }
            .canvas { width: 7000px; height: 5000px; }
            .card { width: 190px; }
            #svg path { stroke-width: 3 !important; }
            .member-list { grid-template-columns: 1fr; }
            .row .btn { min-height: 42px; }
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #718096
        }

        .danger {
            background: #b53a3a
        }


        .member-tools { margin-top:8px; padding-top:8px; border-top:1px solid #edf1f5; }
        .member-link { width:100%; font-size:11px; padding:8px; border:1px solid #d8e1eb; border-radius:8px; background:#f7f9fc; }
        .tool-row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
        .tool-row .btn { padding:7px 9px; font-size:11px; }
        .links-panel { margin-top:16px; border-top:1px solid #e2e8f0; padding-top:14px; }
        .member-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; margin-top:10px; }
        .member-item { border:1px solid #dce4ec; border-radius:12px; padding:12px; background:#fbfcfe; }
        .member-item .name { font-weight:800; }
        .member-item small { color:#718096; display:block; margin:3px 0 8px; }

        .status {
            margin-top: 10px;
            color: #315f91;
            font-size: 13px
        }

        /* =========================
           NATURAL REAL FAMILY TREE
           Bottom-up: trunk = oldest/root, branches grow upward
        ========================== */
        .treebox.natural-mode{background:linear-gradient(#dff5ff 0%,#f8fcff 48%,#d9efc7 100%);overflow:auto;min-height:760px;border-radius:16px;padding:0}
        .natural-canvas{position:relative;width:3000px;height:2100px;overflow:hidden;background:linear-gradient(to bottom,#eaf8ff 0 55%,#d4edbd 100%)}
        .natural-canvas .ground{position:absolute;left:-5%;right:-5%;bottom:-90px;height:260px;background:radial-gradient(ellipse at 50% 8%,#87b85b 0,#a4cc78 32%,#679c47 72%,#4c7e38 100%);border-radius:50% 50% 0 0/32% 32% 0 0;z-index:2}
        .natural-canvas .canopy{position:absolute;left:50%;top:45px;width:2200px;height:760px;transform:translateX(-50%);z-index:1;background:radial-gradient(circle at 9% 58%,#347c2e 0 145px,transparent 149px),radial-gradient(circle at 20% 32%,#4f9a37 0 180px,transparent 184px),radial-gradient(circle at 34% 19%,#68ad43 0 175px,transparent 179px),radial-gradient(circle at 50% 13%,#4b9635 0 210px,transparent 214px),radial-gradient(circle at 65% 18%,#62a943 0 185px,transparent 189px),radial-gradient(circle at 80% 34%,#4f9638 0 180px,transparent 184px),radial-gradient(circle at 92% 58%,#347c2e 0 145px,transparent 149px),radial-gradient(circle at 50% 52%,#3e8b31 0 300px,transparent 304px);filter:drop-shadow(0 18px 16px rgba(45,90,30,.18))}
        .natural-canvas .canopy:after{content:"";position:absolute;inset:70px;background:radial-gradient(circle at 18% 25%,rgba(255,255,255,.17) 0 5px,transparent 6px),radial-gradient(circle at 37% 15%,rgba(255,255,255,.13) 0 4px,transparent 5px),radial-gradient(circle at 62% 23%,rgba(255,255,255,.15) 0 5px,transparent 6px),radial-gradient(circle at 82% 18%,rgba(255,255,255,.12) 0 4px,transparent 5px)}
        .natural-canvas .trunk{position:absolute;left:50%;bottom:120px;width:330px;height:1180px;transform:translateX(-50%);z-index:3;border-radius:46% 46% 18% 18%/7% 7% 4% 4%;background:linear-gradient(90deg,#452513 0%,#67401f 12%,#936033 29%,#70431f 43%,#a56d39 57%,#71421f 72%,#976039 87%,#492713 100%);box-shadow:inset 25px 0 32px rgba(35,16,5,.26),inset -25px 0 32px rgba(35,16,5,.23),0 15px 30px rgba(55,35,15,.25)}
        .natural-canvas .trunk:before,.natural-canvas .trunk:after{content:"";position:absolute;top:35px;bottom:45px;width:9px;border-radius:50%;background:rgba(45,22,8,.23)}.natural-canvas .trunk:before{left:92px;transform:rotate(3deg)}.natural-canvas .trunk:after{right:88px;transform:rotate(-4deg)}
        .natural-canvas .roots{position:absolute;left:50%;bottom:35px;width:1050px;height:300px;transform:translateX(-50%);z-index:3;background:radial-gradient(ellipse at 50% 55%,#633719 0 24%,transparent 26%),radial-gradient(ellipse at 16% 78%,#74441f 0 12%,transparent 14%),radial-gradient(ellipse at 84% 78%,#74441f 0 12%,transparent 14%),radial-gradient(ellipse at 3% 92%,#805126 0 8%,transparent 10%),radial-gradient(ellipse at 97% 92%,#805126 0 8%,transparent 10%);filter:drop-shadow(0 9px 9px rgba(40,25,10,.25))}
        .natural-canvas .natural-svg{position:absolute;inset:0;z-index:5;pointer-events:none}
        .natural-card{position:absolute;width:168px;min-height:112px;padding:8px;text-align:center;background:rgba(255,255,255,.96);border:3px solid #fff;border-radius:18px;box-shadow:0 9px 22px rgba(30,55,25,.22);z-index:12}
        .natural-card img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.22)}
        .natural-card b{display:block;margin-top:5px;font-size:13px;color:#25361f}.natural-card small{display:block;margin-top:2px;color:#3f8c46;font-weight:700}
        .natural-card.trunk-card{width:215px;min-height:148px;border:5px solid #d99b2b;border-radius:24px;background:linear-gradient(#fffdf2,#fff);box-shadow:0 10px 28px rgba(65,45,12,.3);z-index:20}
        .natural-card.trunk-card img{width:78px;height:78px}.natural-card.trunk-card:before{content:"♛";position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:27px;color:#d39b13}
        .natural-card.branch-card{border-color:#e8cfab;background:#fffdf8}
        .natural-card.leaf-card{width:148px;min-height:98px;border:3px solid #91c85e;border-radius:48% 52% 45% 55%/58% 42% 58% 42%;background:linear-gradient(145deg,#fbfff7,#eaf7dc);box-shadow:0 8px 18px rgba(49,95,35,.2)}
        .natural-card.leaf-card img{width:50px;height:50px}.natural-card.leaf-card b{font-size:12px}.natural-card.leaf-card small{font-size:10px}
        .natural-tools{position:absolute;top:16px;right:18px;z-index:30;display:flex;gap:8px;flex-wrap:wrap}.natural-tools .btn{box-shadow:0 5px 14px rgba(0,0,0,.12)}
        @media(max-width:700px){
          .natural-canvas{width:2200px;height:1900px}.natural-canvas .canopy{width:1650px;height:560px}.natural-canvas .trunk{width:230px;height:1050px}.natural-canvas .roots{width:650px;height:230px}.natural-card{width:145px;min-height:112px}.natural-card img{width:58px;height:58px}.natural-card.trunk-card{width:185px;min-height:132px}.natural-card.trunk-card img{width:70px;height:70px}.natural-tools{left:12px;right:auto;top:12px}
        }
    </style>
</head>

<body>
    <header>
        <h1>🌳 Family Tree Admin</h1>
    </header>
    <div class="wrap">
        <div id="login" class="panel">
            <h2>Admin Login</h2>
            <div class="row"><input id="key" type="password" placeholder="Admin password"><button class="btn"
                    onclick="login()">Login</button></div>
            <div class="status">Admin password: call on 9106141725 </div>
        </div>
        <div id="app" style="display:none">
            <div class="panel">
                <div class="row"><button class="btn" onclick="loadFamilies()">🔄 Refresh</button><button class="btn" onclick="createFamily()">➕ નવી Family બનાવો</button><button
                        class="btn gray" onclick="logout()">Logout</button></div>
                <div id="families" class="families" style="margin-top:14px"></div>
            </div>
            <div id="viewer" class="panel" style="display:none">
                <div class="row">
                    <h2 id="viewerTitle" style="margin:0;flex:1">🌳 Selected Family</h2><button class="btn gray" onclick="renderTree()">▦ Simple Tree</button><button class="btn" onclick="renderNaturalTree()">🌳 Real Tree</button><button class="btn" onclick="downloadPNG()">🖼️ Download PNG</button><button class="btn danger" onclick="deleteCurrentFamily()">🗑️ આખી Tree Delete</button>
                </div>
                <div id="treebox" class="treebox">
                    <div id="canvas" class="canvas"><svg id="svg" width="8000" height="4500"
                            style="position:absolute;left:0;top:0;z-index:1"></svg>
                        <div id="cards"></div>
                    </div>
                </div>
                <div class="links-panel">
                    <h3 style="margin:0">🔗 બધા Members ની Links</h3>
                    <div style="font-size:13px;color:#718096;margin-top:5px">Admin અહીંથી કોઈપણ member નું નામ બદલી શકે છે અને તેની link copy/share કરી શકે છે. Name બદલવાથી link બદલાશે નહીં.</div>
                    <div id="memberLinks" class="member-list"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let key = '', people = []; const $ = id => document.getElementById(id);
function showAdminApp() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
}
function login() {
  const entered = $('key').value.trim();
  if (!entered) return;
  key = entered;
  sessionStorage.setItem('adminKey', key);
  showAdminApp();
  loadFamilies();
}
function logout() {
  key = '';
  sessionStorage.removeItem('adminKey');
  location.reload();
}
async function createFamily(){
  const name=prompt('નવી Family માટે પ્રથમ સભ્યનું પૂરું નામ લખો:');
  if(!name || !name.trim()) return;
  try{
    const fd=new FormData();
    fd.append('name',name.trim());
    const r=await fetch('/api/family/start',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok || !d.ok) return alert(d.error || 'Family બનાવી શકાઈ નથી');
    alert('Family બની ગઈ! Family ID: '+d.familyId);
    await loadFamilies();
    const box=document.getElementById('families');
    const btn=[...box.querySelectorAll('button')].find(b=>b.textContent.includes('Tree જુઓ'));
    if(btn) btn.click();
  }catch(e){
    alert('Family બનાવતી વખતે error: '+e.message);
  }
} async function loadFamilies() {
  key = sessionStorage.getItem('adminKey') || key;
  if (!key) { $('app').style.display='none'; $('login').style.display='block'; return; }
  let r = await fetch('/api/admin/families', { headers:{'x-admin-key':key} });
  let d = await r.json();
  if (!r.ok || !d.ok) { alert(d.error || 'Admin password ખોટો છે'); sessionStorage.removeItem('adminKey'); key=''; $('app').style.display='none'; $('login').style.display='block'; return; }
  let box=$('families'); box.innerHTML='';
  if(!d.families.length){ box.innerHTML='<div class="empty">હજુ કોઈ family data નથી.<br><button class="btn" style="margin-top:12px" onclick="createFamily()">➕ પ્રથમ Family બનાવો</button></div>'; return; }
  d.families.forEach(f=>{ let div=document.createElement('div'); div.className='family'; div.innerHTML='<b>Family ID: '+esc(f._id)+'</b><div>સભ્યો: '+f.people+'</div><div class="family-actions"><button class="btn" onclick="viewFamily(\''+escAttr(f._id)+'\')">🌳 Tree જુઓ</button><button class="btn danger" onclick="deleteFamily(\''+escAttr(f._id)+'\')">🗑️ Delete Tree</button></div>'; box.appendChild(div); });
}
async function deleteFamily(id){
  if(!confirm('આ Family ની આખી tree અને તેના બધા members કાયમ માટે delete કરવી છે?')) return;
  try{
    const r=await fetch('/api/admin/family/'+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-key':key}});
    const d=await r.json();
    if(!r.ok || !d.ok) return alert(d.error||'Tree delete થઈ નથી');
    if(window.currentFamilyId===id){ $('viewer').style.display='none'; people=[]; }
    alert('આખી Family Tree delete થઈ ગઈ.');
    await loadFamilies();
  }catch(e){ alert('Delete error: '+e.message); }
}
async function deleteCurrentFamily(){ if(window.currentFamilyId) await deleteFamily(window.currentFamilyId); }
async function viewFamily(id){
  window.currentFamilyId=id;
  let r=await fetch('/api/family/'+encodeURIComponent(id)),d=await r.json();
  if(!d.ok)return alert(d.error);
  people=d.people;
  $('viewer').style.display='block';
  renderTree();
  $('viewer').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(focusTreeRoot,100);
}
function focusTreeRoot(){
  const box=$('treebox');
  const root=people.find(p=>!p.parentId);
  if(!box||!root||!root.__pos)return;
  box.scrollTo({left:Math.max(0,root.__pos.x-25),top:Math.max(0,root.__pos.y-25),behavior:'smooth'});
}
function renderTree(){
  $('treebox').classList.remove('natural-mode');
  restoreSimpleCanvas();
  $('viewerTitle').innerHTML='🌳 Selected Family';
  let cards=$('cards'),svg=$('svg'); cards.innerHTML=''; svg.innerHTML='';
  if(!people.length)return;
  const children={};
  people.forEach(p=>(children[String(p.parentId||'root')]??=[]).push(p));
  Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt)-new Date(y.createdAt)));
  const CARD_W=190,GAP=55,LEVEL_GAP=300,ROOT_X=380,ROOT_Y=60;
  function subtreeWidth(id){const kids=children[id]||[];if(!kids.length)return CARD_W;return kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);}
  const root=people.find(p=>!p.parentId); if(!root)return;
  const pos={};
  function layout(id,x,y){
    const node=people.find(p=>String(p._id)===String(id)); if(!node)return;
    const kids=children[String(id)]||[];
    const w=subtreeWidth(String(id));
    pos[String(id)]={x:x-CARD_W/2,y};
    node.__pos={x:x-CARD_W/2,y};
    if(kids.length){let total=kids.reduce((s,k)=>s+subtreeWidth(String(k._id)),0)+GAP*(kids.length-1);let cur=x-total/2;kids.forEach(k=>{const kw=subtreeWidth(String(k._id));layout(String(k._id),cur+kw/2,y+LEVEL_GAP);cur+=kw+GAP;});}
  }
  layout(String(root._id),ROOT_X,ROOT_Y);
  const maxX=Math.max(1200,...Object.values(pos).map(q=>q.x+CARD_W+250));
  const maxY=Math.max(2200,...Object.values(pos).map(q=>q.y+260));
  $('canvas').style.width=maxX+'px'; $('canvas').style.height=maxY+'px'; svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  people.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    let d=document.createElement('div'); d.className='card'; d.style.left=q.x+'px'; d.style.top=q.y+'px';
    let link=addLink(p.addToken);
    d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+esc(p.name)+'</b><small>Generation '+p.generation+'</small><div class="member-tools"><input class="member-link" value="'+esc(link)+'" readonly><div class="tool-row"><button class="btn" onclick="copyLink(\''+escAttr(link)+'\')">🔗 Copy Link</button><button class="btn gray" onclick="editName(\''+escAttr(p._id)+'\')">✏️ Name</button></div></div>';
    cards.appendChild(d);
  });
  people.forEach(p=>{if(!p.parentId)return;const a=pos[String(p.parentId)],b=pos[String(p._id)];if(a&&b)draw(svg,a.x+CARD_W/2,a.y+170,b.x+CARD_W/2,b.y);});
  renderMemberLinks();
}

function renderNaturalTree(){
  const box=$('treebox'); box.classList.add('natural-mode');
  const canvas=$('canvas'); canvas.className='natural-canvas';
  canvas.innerHTML='<div class="canopy"></div><div class="trunk"></div><div class="roots"></div><div class="ground"></div><svg id="naturalSvg" class="natural-svg"></svg><div id="naturalCards"></div><div class="natural-tools"><button class="btn gray" onclick="renderTree()">▦ Simple</button><button class="btn danger" onclick="deleteCurrentFamily()">🗑️ Delete Tree</button></div>';
  if(!people.length)return;
  const root=people.find(p=>!p.parentId) || people.slice().sort((a,b)=>(Number(a.generation)||1)-(Number(b.generation)||1))[0];
  if(!root)return;

  const svg=document.getElementById('naturalSvg'), cards=document.getElementById('naturalCards');
  const children={};
  people.forEach(p=>{ const k=String(p.parentId||'root'); (children[k]??=[]).push(p); });
  Object.values(children).forEach(a=>a.sort((x,y)=>new Date(x.createdAt||0)-new Date(y.createdAt||0)));

  // Build levels from the actual parentId relationship. Root is at the bottom; every child is above its parent.
  const levels=[];
  const visited=new Set();
  function walk(p,level){
    if(visited.has(String(p._id))) return;
    visited.add(String(p._id));
    (levels[level]??=[]).push(p);
    (children[String(p._id)]||[]).forEach(c=>walk(c,level+1));
  }
  walk(root,0);
  people.forEach(p=>{if(!visited.has(String(p._id))) walk(p,0);});

  const maxLevel=Math.max(0,levels.length-1);
  const W=Math.max(3000,Math.min(6000,1800+Math.max(0,people.length-1)*240));
  const H=Math.max(2100,900+levels.length*330);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  const center=W/2, pos={};

  // Root is deep in the trunk. Higher generations move upward toward the crown.
  const rootY=H-430;
  const topY=250;
  const gap=maxLevel?Math.max(230,(rootY-topY)/maxLevel):330;

  // Give each generation a wide natural spread, while keeping each child's subtree close to its parent.
  const subtree={};
  function subtreeWidth(p){
    const kids=children[String(p._id)]||[];
    if(!kids.length){ subtree[String(p._id)]=1; return 1; }
    const n=kids.reduce((sum,k)=>sum+subtreeWidth(k),0);
    subtree[String(p._id)]=Math.max(1,n);
    return subtree[String(p._id)];
  }
  subtreeWidth(root);

  function layoutChildren(parent, left, right, level){
    const kids=children[String(parent._id)]||[];
    if(!kids.length)return;
    const total=kids.reduce((s,k)=>s+subtree[String(k._id)],0);
    let cursor=left;
    kids.forEach(k=>{
      const ratio=subtree[String(k._id)]/total;
      const a=cursor, b=cursor+(right-left)*ratio;
      const x=(a+b)/2;
      pos[String(k._id)]={x,y:rootY-level*gap};
      layoutChildren(k,a,b,level+1);
      cursor=b;
    });
  }
  pos[String(root._id)]={x:center,y:rootY};
  layoutChildren(root,220,W-220,1);

  // Any disconnected member still gets a sensible upper position.
  const placed=new Set(Object.keys(pos));
  people.filter(p=>!placed.has(String(p._id))).forEach((p,i)=>{
    pos[String(p._id)]={x:320+i*190,y:topY};
  });

  const ns='http://www.w3.org/2000/svg';
  // Draw organic branch from parent to child. Parent is below child in this tree.
  function branch(parent,child,level){
    const a=pos[String(parent._id)], b=pos[String(child._id)]; if(!a||!b)return;
    const p=document.createElementNS(ns,'path');
    const dx=b.x-a.x, dy=b.y-a.y;
    const bendY=a.y-dy*.46;
    const curve=Math.max(70,Math.min(260,Math.abs(dx)*.18));
    p.setAttribute('d',`M ${a.x} ${a.y} C ${a.x} ${bendY} ${b.x} ${bendY} ${b.x} ${b.y}`);
    p.setAttribute('fill','none');
    const sw=Math.max(9,36-level*5);
    p.setAttribute('stroke','#543018'); p.setAttribute('stroke-width',sw); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
    svg.appendChild(p);
    const hi=document.createElementNS(ns,'path');
    hi.setAttribute('d',p.getAttribute('d')); hi.setAttribute('fill','none'); hi.setAttribute('stroke','#9b6333'); hi.setAttribute('stroke-width',Math.max(3,sw*.25)); hi.setAttribute('stroke-linecap','round'); svg.appendChild(hi);
  }
  function drawAll(p,level){
    (children[String(p._id)]||[]).forEach(c=>{branch(p,c,level+1);drawAll(c,level+1);});
  }
  drawAll(root,0);

  // Natural twig tips behind the highest-generation cards.
  const highest=levels[maxLevel]||[];
  highest.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    const twig=document.createElementNS(ns,'path');
    twig.setAttribute('d',`M ${q.x} ${q.y} C ${q.x} ${q.y-45} ${q.x+(q.x<center?-35:35)} ${q.y-70} ${q.x+(q.x<center?-55:55)} ${q.y-105}`);
    twig.setAttribute('fill','none'); twig.setAttribute('stroke','#6d4222'); twig.setAttribute('stroke-width','8'); twig.setAttribute('stroke-linecap','round'); svg.appendChild(twig);
  });

  people.forEach(p=>{
    const q=pos[String(p._id)]; if(!q)return;
    const level=(function(){ for(let i=0;i<levels.length;i++) if(levels[i].some(x=>String(x._id)===String(p._id))) return i; return 0; })();
    const isRoot=String(p._id)===String(root._id);
    const isLeaf=level===maxLevel && !((children[String(p._id)]||[]).length);
    const d=document.createElement('div');
    d.className='natural-card '+(isRoot?'trunk-card':(isLeaf?'leaf-card':'branch-card'));
    const w=isRoot?215:(isLeaf?148:168), h=isRoot?148:(isLeaf?98:112);
    d.style.left=(q.x-w/2)+'px'; d.style.top=(q.y-h/2)+'px';
    const label=isRoot?'👴 Grand Father / Main Person':isLeaf?'🍃 Last Generation':'🌿 Father / Branch';
    d.innerHTML='<img src="'+(p.photo||avatar(p.name))+'"><b>'+esc(p.name)+'</b><small>'+label+'</small>';
    cards.appendChild(d);
  });

  $('viewerTitle').innerHTML='🌳 Real Natural Family Tree';
  // Focus on the trunk/base first, so Admin immediately understands the tree direction.
  setTimeout(()=>{
    $('treebox').scrollLeft=Math.max(0,center-$('treebox').clientWidth/2);
    $('treebox').scrollTop=Math.max(0,rootY-$('treebox').clientHeight+260);
  },60);
}

function draw(svg, x1, y1, x2, y2) { let ns = 'http://www.w3.org/2000/svg', p = document.createElementNS(ns, 'path'), m = (y1 + y2) / 2; p.setAttribute('d', `M${x1} ${y1} L${x1} ${m} L${x2} ${m} L${x2} ${y2}`); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#71849a'); p.setAttribute('stroke-width', '4'); svg.appendChild(p) } function avatar(n) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#e7edf5"/><text x="50" y="62" text-anchor="middle" font-size="42" font-family="Arial" font-weight="700" fill="#61758e">${(n || '?')[0].toUpperCase()}</text></svg>`) } function esc(v) { return String(v || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) } function escAttr(v) { return String(v || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'") } async function downloadPNG() { if (!people.length) return; if (!window.html2canvas) { let s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; document.head.appendChild(s); await new Promise(r => s.onload = r) } let c = await html2canvas($('canvas'), { scale: 2, backgroundColor: '#fbfcfe', useCORS: true }), a = document.createElement('a'); a.download = 'family-tree-admin.png'; a.href = c.toDataURL('image/png'); a.click() }
